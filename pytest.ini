[pytest]
# Adds the project root to sys.path so that "from Metropolis_Hastings import ..." works in
# tests without installing the samplers as a package.
pythonpath = .
testpaths = tests

# Tests marked xfail document a confirmed bug. With strict, a fixed bug "unexpectedly passes" and the
# run FAILS, which reminds you to remove the marker so the test guards the fix.
xfail_strict = true
